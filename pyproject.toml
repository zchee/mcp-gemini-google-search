[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gemini_search"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[project]
name = "mcp-gemini-search"
dynamic = ["version"]
description = "MCP server that provides Google Search via Gemini's built-in Grounding with Google Search feature."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.15.1",
    "google-genai[aiohttp]>=2.24.0",
    "jsonschema>=4.26.0",
    "mcp-types>=2.2.0",
    "mcp[cli]>=2.2.0",
    "mdformat-gfm>=1.0.0",
    "mdformat>=1.0.0",
    "orjson>=3.12.0",
    "python-dotenv>=1.2.3",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/zchee/mcp-gemini-search"
Repository = "https://github.com/zchee/mcp-gemini-search"

[project.scripts]
mcp-gemini-search = "mcp_gemini_search.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark",
    "ruff",
    "ty",
]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 120
preview = true
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle (Error)
    "W", # pycodestyle (Warning)
    "F", # Pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "D", # pydocstyle
    "PIE", # flake8-pie
    "PERF", # Perflint
    "PT", # flake8-pytest-style
    "T20", # flake8-print
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "PYI", # flake8-pyi
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "ASYNC", # flake8-async
    "SLF", # flake8-self
    "RET", # flake8-return
    "FURB", # refurb
    "G", # flake8-logging-format
    "LOG", # flake8-logging
    "N", # pep8-naming
    "ERA", # eradicate
    "TC", # flake8-type-checking
    "TD", # flake8-todos
    "unnecessary-paren-on-raise-exception", # flake8-raise/RSE102
    "SLOT", # flake8-slots
    "blanket-type-ignore", # pygrep-hooks/PGH003
    "blanket-noqa", # pygrep-hooks/PGH004
    "implicit-namespace-package", # flake8-no-pep420/INP001
]
ignore = [
    # The SDK's create/get return Interaction | AsyncStream[...], and the
    # Protocols have to stay structurally compatible with that, so Any is the
    # honest annotation rather than a missing one.
    "any-type", # flake8-annotations/ANN401
    # Error strings are part of the contract here: they mirror the Go server's
    # messages verbatim and the tests assert them. One exception class per
    # message would move that contract away from the raise site for no gain.
    "raise-vanilla-args", # tryceratops/TRY003
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Stub methods mirror the real API signatures whether or not a body reads
    # every parameter, and keyword-only names cannot be underscore-prefixed.
    "unused-method-argument", # flake8-unused-arguments/ARG002
    # The suite exercises module-level and class-level privates on purpose.
    "private-member-access", # flake8-self/SLF001
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "-m 'not benchmark and not live'"
markers = [
    "benchmark: performance benchmarks; deselected by default, run with -m benchmark",
    "live: tests that call the real Gemini API; deselected by default, run with -m live",
    "slow: multi-minute tests excluded from -m live alone; require RUN_SLOW=1",
]
filterwarnings = [
    # google-genai builds a Union alias out of a private typing name on import.
    'ignore::DeprecationWarning:google\.genai\.types',
    "ignore:'_UnionGenericAlias' is deprecated.*:DeprecationWarning:google.genai.types",
]
